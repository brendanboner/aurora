[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-creator-service"
version = "0.1.0"
description = "Autonomous Creator Agent service for Aurora"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "openai",
    "neo4j-client",
    "rabbitmq-client",
    "redis",
    "python-dateutil",
    "httpx",
]

[tool.uv.sources]
neo4j-client = { workspace = true }
rabbitmq-client = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.sql", "*.json"]
