server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Favicon - return the vite.svg or 204 if not found
    location = /favicon.ico {
        try_files /vite.svg =204;
        access_log off;
        log_not_found off;
    }

    # Backend API proxy (internal only, no auth needed)
    # Frontend calls /kg-api/* which proxies to kg-view-backend:8002/api/*
    location /kg-api/ {
        rewrite ^/kg-api/(.*)$ /api/$1 break;
        proxy_pass http://kg-view-backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
