[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-service"
version = "0.1.0"
description = "Aurora Oracle Service - Enhanced Question-Answering with Graph-Aware RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "openai",
    "neo4j-client",
    "redis",
    "python-dateutil",
    "tiktoken",
    "aiohttp",
    "numpy",
    "youtube-transcript-api>=0.6.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    # OpenTelemetry
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-redis>=0.41b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    # Prometheus metrics
    "prometheus-client>=0.17.0",
]

[tool.uv.sources]
neo4j-client = { workspace = true }
rabbitmq-client = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
