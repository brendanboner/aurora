# GitHub Actions workflow for Curator Service Tests
# This workflow runs on push to main and on pull requests
# TEMPORARILY DISABLED - uncomment 'on:' section to re-enable

name: Curator Tests

# on:
#   push:
#     branches: [main, master]
#     paths:
#       - 'curator/**'
#       - '.github/workflows/curator-tests.yml'
#   pull_request:
#     branches: [main, master]
#     paths:
#       - 'curator/**'
#       - '.github/workflows/curator-tests.yml'
#   # Allow manual trigger
#   workflow_dispatch:

on: workflow_dispatch  # Manual trigger only for now

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: curator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock
          # Install neo4j-client from local path
          pip install -e ../neo4j-client

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          pytest testing/unit -v --tb=short

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest testing/unit --cov=. --cov-report=xml --cov-report=term-missing
        continue-on-error: true  # Don't fail on coverage issues initially

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: curator/coverage.xml
          flags: curator
          name: curator-coverage
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: curator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment and install linters
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: |
          source .venv/bin/activate
          ruff check . --output-format=github
        continue-on-error: true  # Don't fail on lint issues initially

  type-check:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: curator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-redis
          pip install -e ../neo4j-client

      - name: Run type checking
        run: |
          source .venv/bin/activate
          mypy . --ignore-missing-imports --no-error-summary
        continue-on-error: true  # Don't fail on type issues initially
