#version: "3.9"

# =============================================================================
# Aurora Docker Compose Configuration - DEVELOPMENT
# =============================================================================
# This is the main development configuration with hot reload enabled.
#
# Usage:
#   docker compose up -d
#
# Features:
#   - React dev server with hot module replacement (HMR)
#   - Edit code → see changes instantly
#   - Source maps for debugging
#   - All backend services for local development
#
# Access:
#   - Frontend: http://localhost:3000 (React dev server)
#   - Through nginx: http://localhost (proxies to React dev server)
#   - API: http://localhost/api/*
# =============================================================================

# Shared network for all services
networks:
  aurora-network:
    driver: bridge

# Persistent volumes
volumes:
  postgres-data:
    driver: local
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  rabbitmq-data:
    driver: local
  redis-data:
    driver: local
  tempo-data:
    driver: local
  loki-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================
  # NOTE: These ports are exposed for development/debugging convenience
  # For production: Remove port mappings or restrict with firewall rules
  
  postgres:
    image: postgres:16-alpine
    container_name: aurora-postgres
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./prod-deployment/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./prod-deployment/migrations/002_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql:ro
      - ./prod-deployment/migrations/003_add_feedback_table.sql:/docker-entrypoint-initdb.d/003_add_feedback_table.sql:ro
      - ./prod-deployment/migrations/004_add_oracle_config_table.sql:/docker-entrypoint-initdb.d/004_add_oracle_config_table.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurora} -d ${POSTGRES_DB:-aurora}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:2025-community
    container_name: aurora-neo4j
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-your_neo4j_password_here} 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  rabbitmq:
    image: rabbitmq:4.2.0-management-alpine
    container_name: aurora-rabbitmq
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: aurora-redis
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # Initialization Services
  # =============================================================================

  neo4j-init:
    build:
      context: .
      dockerfile: neo4j-init/Dockerfile
    container_name: aurora-neo4j-init
    networks:
      - aurora-network
    restart: "no"
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      
      # Embeddings (use OpenAI)
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
      
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      neo4j:
        condition: service_healthy

  # =============================================================================
  # Application Services
  # =============================================================================
  
  # Auth Service - API Gateway and Authentication
  # This is the ONLY publicly exposed application service
  # All user requests go through this service for authentication
  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: aurora-auth
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "${AUTH_PORT:-8000}:8000"
    environment:
      # AWS Cognito Configuration
      AWS_REGION: ${AWS_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID}
      COGNITO_APP_CLIENT_SECRET: ${COGNITO_APP_CLIENT_SECRET}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN}
      # Auto-constructed
      COGNITO_JWKS_URL: https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}/.well-known/jwks.json
      COGNITO_TOKEN_ENDPOINT: https://${COGNITO_DOMAIN}/oauth2/token
      
      # Service URLs (internal Docker network - use container names)
      BACKEND_SERVICE_URL: ${BACKEND_SERVICE_URL:-http://backend:8000}
      CURATOR_SERVICE_URL: ${CURATOR_SERVICE_URL:-http://curator:8000}
      RETRIEVER_SERVICE_URL: ${RETRIEVER_SERVICE_URL:-http://retriever:8000}
      CONTENT_CREATOR_SERVICE_URL: ${CONTENT_CREATOR_SERVICE_URL:-http://content_creator_service:8000}
      ORACLE_SERVICE_URL: ${ORACLE_SERVICE_URL:-http://oracle:8000}
      KG_VIEW_BACKEND_URL: ${KG_VIEW_BACKEND_URL:-http://kg-view-backend:8002}
      
      # Application Configuration (simplified - single domain derives URL and cookie)
      DEPLOYMENT_DOMAIN: ${DEPLOYMENT_DOMAIN:-localhost}
      USE_HTTPS: ${USE_HTTPS:-false}
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # OpenTelemetry Configuration
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-1.0}
      OTEL_HASH_CYPHER_QUERIES: ${OTEL_HASH_CYPHER_QUERIES:-false}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aurora-backend
    restart: unless-stopped
    networks:
      - aurora-network
    environment:
      # Database
      PG_DSN: postgresql://${POSTGRES_USER:-aurora}:${POSTGRES_PASSWORD:-aurora_password}@postgres:5432/${POSTGRES_DB:-aurora}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora_password}
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
      
      # Neo4j
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      
      # Azure OpenAI
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # RabbitMQ
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-scraped_content}
      
      # S3 Document Storage
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_DOCUMENT_BUCKET: ${S3_DOCUMENT_BUCKET:-aurora-document-uploads}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # OpenTelemetry Configuration
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-1.0}
      OTEL_HASH_CYPHER_QUERIES: ${OTEL_HASH_CYPHER_QUERIES:-false}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  oracle:
    build:
      context: .
      dockerfile: oracle/Dockerfile
    container_name: aurora-oracle
    restart: unless-stopped
    networks:
      - aurora-network
    # Allow container to reach host machine (for SSH tunnel to prod Neo4j)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Neo4j
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      
      # PostgreSQL (for user preferences)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora_password}
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
      
      # Azure OpenAI
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # RabbitMQ (for YouTube video ingestion)
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      
      # YouTube Proxy (optional - for bypassing cloud provider IP blocks)
      YOUTUBE_PROXY_HTTP: ${YOUTUBE_PROXY_HTTP:-}
      YOUTUBE_PROXY_HTTPS: ${YOUTUBE_PROXY_HTTPS:-}
      
      # Fast Pipeline
      FAST_PIPELINE_ENABLED: ${FAST_PIPELINE_ENABLED:-true}
      FAST_ROLLUP_GENERATION_ENABLED: ${FAST_ROLLUP_GENERATION_ENABLED:-true}
      FAST_ROLLUP_GENERATION_CRON: ${FAST_ROLLUP_GENERATION_CRON:-0 2 * * *}
      FAST_ROLLUP_DAILY_LOOKBACK: ${FAST_ROLLUP_DAILY_LOOKBACK:-14}
      FAST_ROLLUP_WEEKLY_LOOKBACK: ${FAST_ROLLUP_WEEKLY_LOOKBACK:-4}
      FAST_ROLLUP_MONTHLY_LOOKBACK: ${FAST_ROLLUP_MONTHLY_LOOKBACK:-3}
      
      # OpenTelemetry Configuration
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-1.0}
      OTEL_HASH_CYPHER_QUERIES: ${OTEL_HASH_CYPHER_QUERIES:-false}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  retriever:
    build:
      context: .
      dockerfile: retriever/Dockerfile
    container_name: aurora-retriever
    restart: unless-stopped
    networks:
      - aurora-network
    environment:
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora_password}
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
      
      # RabbitMQ
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-scraped_content}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      
      # Web Scraping Authentication
      WFA_CAUSEWAY_USERNAME: ${WFA_CAUSEWAY_USERNAME}
      WFA_CAUSEWAY_PASSWORD: ${WFA_CAUSEWAY_PASSWORD}
      WBA_USERNAME: ${WBA_USERNAME}
      WBA_PASSWORD: ${WBA_PASSWORD}
      
      # S3 Document Storage
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_DOCUMENT_BUCKET: ${S3_DOCUMENT_BUCKET:-aurora-document-uploads}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      
      # Application Environment (dev disables scheduled scrapes)
      APP_ENV: ${APP_ENV:-prod}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # OpenTelemetry Configuration
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-1.0}
      OTEL_HASH_CYPHER_QUERIES: ${OTEL_HASH_CYPHER_QUERIES:-false}
      
      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  digester:
    build:
      context: .
      dockerfile: digester/Dockerfile
    container_name: aurora-digester
    restart: unless-stopped
    networks:
      - aurora-network
    environment:
      # RabbitMQ
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-scraped_content}
      RABBITMQ_MAX_WORKERS: ${RABBITMQ_MAX_WORKERS:-4}
      RABBITMQ_HEARTBEAT: ${RABBITMQ_HEARTBEAT:-180}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Neo4j
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      
      # Azure OpenAI
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_RATE_LIMIT_RETRIES: ${LLM_RATE_LIMIT_RETRIES:-3}
      
      # Embeddings
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      
      # Content Processing
      MAX_CHUNK_SIZE: ${MAX_CHUNK_SIZE:-8000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-500}
      MAX_MESSAGE_RETRIES: ${MAX_MESSAGE_RETRIES:-3}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # OpenTelemetry Configuration
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-1.0}
      OTEL_HASH_CYPHER_QUERIES: ${OTEL_HASH_CYPHER_QUERIES:-false}
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  curator:
    build:
      context: .
      dockerfile: curator/Dockerfile
    container_name: aurora-curator
    # Long-running service with scheduled tasks
    restart: unless-stopped
    networks:
      - aurora-network
    environment:
      # Neo4j
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      
      # Azure OpenAI
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      
      # Embeddings
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      
      # RabbitMQ (for queue monitoring)
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-scraped_content}
      
      # Redis (for monitoring digester state and event reconciliation)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Curator Clustering Configuration
      CLUSTER_MIN_SIZE: ${CLUSTER_MIN_SIZE:-3}
      CLUSTER_MAX_SIZE: ${CLUSTER_MAX_SIZE:-10}
      CLUSTER_DISTANCE_THRESHOLD: ${CLUSTER_DISTANCE_THRESHOLD:-0.5}
      CLUSTER_OVERLAP_NEIGHBORS: ${CLUSTER_OVERLAP_NEIGHBORS:-3}
      MAX_TOPICS_PER_LLM_CALL: ${MAX_TOPICS_PER_LLM_CALL:-20}
      HIERARCHY_CONFIDENCE_THRESHOLD: ${HIERARCHY_CONFIDENCE_THRESHOLD:-0.7}
      ENABLE_CROSS_CLUSTER_ANALYSIS: ${ENABLE_CROSS_CLUSTER_ANALYSIS:-true}
      
      # Scheduler Configuration
      TOPIC_ORGANIZATION_CRON: ${TOPIC_ORGANIZATION_CRON:-0 6 * * *}
      TOPIC_THRESHOLD_ENABLED: ${TOPIC_THRESHOLD_ENABLED:-true}
      TOPIC_THRESHOLD_COUNT: ${TOPIC_THRESHOLD_COUNT:-50}
      TOPIC_THRESHOLD_CHECK_INTERVAL_SECONDS: ${TOPIC_THRESHOLD_CHECK_INTERVAL_SECONDS:-60}
      EVENT_RECONCILIATION_CHECK_INTERVAL_SECONDS: ${EVENT_RECONCILIATION_CHECK_INTERVAL_SECONDS:-60}
      EVENT_RECONCILIATION_ENABLED: ${EVENT_RECONCILIATION_ENABLED:-true}
      
      # API Configuration (internal port - external configured via port mapping)
      API_HOST: 0.0.0.0
      API_PORT: 8000
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # OpenTelemetry Configuration
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-1.0}
      OTEL_HASH_CYPHER_QUERIES: ${OTEL_HASH_CYPHER_QUERIES:-false}
    depends_on:
      neo4j-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  content_creator_service:
    build:
      context: .
      dockerfile: content_creator_service/Dockerfile
    container_name: aurora-content-creator
    restart: unless-stopped
    networks:
      - aurora-network
    environment:
      PG_DSN: postgresql://${POSTGRES_USER:-aurora}:${POSTGRES_PASSWORD:-aurora_password}@postgres:5432/${POSTGRES_DB:-aurora}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora_password}
      POSTGRES_DB: ${POSTGRES_DB:-aurora}

      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}

      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-scraped_content}

      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # OpenTelemetry Configuration
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-1.0}
      OTEL_HASH_CYPHER_QUERIES: ${OTEL_HASH_CYPHER_QUERIES:-false}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: aurora-frontend
    restart: unless-stopped
    networks:
      - aurora-network
    volumes:
      # Mount source code for hot reload
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      # Use named volumes for node_modules (don't overwrite)
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"  # Expose React dev server
    environment:
      - HOST=0.0.0.0  # Bind to all interfaces, not just localhost
      - CHOKIDAR_USEPOLLING=true  # Enable hot reload in Docker
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0  # Fix WebSocket connection issues
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s      # Check every 15 seconds
      timeout: 5s
      retries: 10        # Allow 10 failures (10 * 15s = 150s total)
      start_period: 60s  # Wait 60s before starting checks (gives webpack initial compile time)

  # =============================================================================
  # Nginx Reverse Proxy
  # =============================================================================

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.hotreload
    container_name: aurora-nginx
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
      auth:
        condition: service_healthy
      kg-view-frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =============================================================================
  # Observability Stack
  # =============================================================================
  
  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: aurora-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    networks:
      - aurora-network
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics exporter
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  # Tempo - Distributed Tracing Backend
  tempo:
    image: grafana/tempo:2.3.1
    container_name: aurora-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    networks:
      - aurora-network
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4317"        # OTLP gRPC receiver
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: aurora-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - aurora-network
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  # Prometheus - Metrics Storage
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: aurora-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - aurora-network
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  # Grafana - Observability UI
  grafana:
    image: grafana/grafana:10.2.3
    container_name: aurora-grafana
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # KG View Service (Knowledge Graph Visualization)
  # =============================================================================
  
  kg-view-backend:
    build:
      context: .
      dockerfile: kg_view/Dockerfile.backend
    container_name: aurora-kg-view-backend
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "8002:8002"
    environment:
      # Neo4j Configuration
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_URI: bolt://neo4j:${NEO4J_BOLT_PORT:-7687}
      
      # Azure OpenAI Configuration
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      
      # CORS Configuration
      CORS_ORIGINS: ${KG_VIEW_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kg-view-frontend:
    build:
      context: .
      dockerfile: kg_view/Dockerfile.frontend
    container_name: aurora-kg-view-frontend
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "5173:5173"
    depends_on:
      kg-view-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

