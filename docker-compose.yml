#version: "3.9"

# Shared network for all services
networks:
  aurora-network:
    driver: bridge

# Persistent volumes
volumes:
  postgres-data:
    driver: local
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  rabbitmq-data:
    driver: local
  redis-data:
    driver: local

services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================
  
  postgres:
    image: postgres:16-alpine
    container_name: aurora-postgres
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurora} -d ${POSTGRES_DB:-aurora}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:2025-community}
    container_name: aurora-neo4j
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-your_neo4j_password_here} 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.2.0-management-alpine}
    container_name: aurora-rabbitmq
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: aurora-redis
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # Initialization Services
  # =============================================================================

  neo4j-init:
    build:
      context: .
      dockerfile: neo4j-init/Dockerfile
    container_name: aurora-neo4j-init
    networks:
      - aurora-network
    restart: "no"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      
      # Embeddings (use OpenAI)
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      neo4j:
        condition: service_healthy

  # =============================================================================
  # Application Services
  # =============================================================================

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aurora-backend
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "8000:8000"
    environment:
      # Database
      PG_DSN: postgresql://${POSTGRES_USER:-aurora}:${POSTGRES_PASSWORD:-aurora_password}@postgres:5432/${POSTGRES_DB:-aurora}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora_password}
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
      
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      
      # Azure OpenAI
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-scraped_content}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  retriever:
    build:
      context: .
      dockerfile: retriever/Dockerfile
    container_name: aurora-retriever
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "${SCRAPER_API_PORT:-8001}:8000"
    environment:
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora_password}
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
      
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-scraped_content}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # WFA Causeway Portal
      WFA_CAUSEWAY_BASE_URL: ${WFA_CAUSEWAY_BASE_URL:-https://groups.wi-fi.org/}
      WFA_CAUSEWAY_USERNAME: ${WFA_CAUSEWAY_USERNAME}
      WFA_CAUSEWAY_PASSWORD: ${WFA_CAUSEWAY_PASSWORD}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  digester:
    build:
      context: .
      dockerfile: digester/Dockerfile
    container_name: aurora-digester
    restart: unless-stopped
    networks:
      - aurora-network
    environment:
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-scraped_content}
      RABBITMQ_MAX_WORKERS: ${RABBITMQ_MAX_WORKERS:-4}
      RABBITMQ_HEARTBEAT: ${RABBITMQ_HEARTBEAT:-180}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      
      # Azure OpenAI
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_RATE_LIMIT_RETRIES: ${LLM_RATE_LIMIT_RETRIES:-3}
      
      # Embeddings
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-mpnet-base-v2}
      
      # Content Processing
      MAX_CHUNK_SIZE: ${MAX_CHUNK_SIZE:-8000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-500}
      MAX_MESSAGE_RETRIES: ${MAX_MESSAGE_RETRIES:-3}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  curator:
    build:
      context: .
      dockerfile: curator/Dockerfile
    container_name: aurora-curator
    # Long-running service with scheduled tasks
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "${CURATOR_API_PORT:-8002}:8000"
    environment:
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-your_neo4j_password_here}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      
      # Azure OpenAI
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      
      # Embeddings
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-mpnet-base-v2}
      
      # RabbitMQ (for queue monitoring)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-scraped_content}
      
      # Redis (for monitoring digester state and event reconciliation)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Curator Clustering Configuration
      CLUSTER_MIN_SIZE: ${CLUSTER_MIN_SIZE:-3}
      CLUSTER_MAX_SIZE: ${CLUSTER_MAX_SIZE:-10}
      CLUSTER_DISTANCE_THRESHOLD: ${CLUSTER_DISTANCE_THRESHOLD:-0.5}
      CLUSTER_OVERLAP_NEIGHBORS: ${CLUSTER_OVERLAP_NEIGHBORS:-3}
      MAX_TOPICS_PER_LLM_CALL: ${MAX_TOPICS_PER_LLM_CALL:-20}
      HIERARCHY_CONFIDENCE_THRESHOLD: ${HIERARCHY_CONFIDENCE_THRESHOLD:-0.7}
      ENABLE_CROSS_CLUSTER_ANALYSIS: ${ENABLE_CROSS_CLUSTER_ANALYSIS:-true}
      
      # Scheduler Configuration
      TOPIC_ORGANIZATION_CRON: ${TOPIC_ORGANIZATION_CRON:-0 6 * * *}
      TOPIC_THRESHOLD_ENABLED: ${TOPIC_THRESHOLD_ENABLED:-true}
      TOPIC_THRESHOLD_COUNT: ${TOPIC_THRESHOLD_COUNT:-50}
      TOPIC_THRESHOLD_CHECK_INTERVAL_SECONDS: ${TOPIC_THRESHOLD_CHECK_INTERVAL_SECONDS:-60}
      EVENT_RECONCILIATION_CHECK_INTERVAL_SECONDS: ${EVENT_RECONCILIATION_CHECK_INTERVAL_SECONDS:-60}
      EVENT_RECONCILIATION_ENABLED: ${EVENT_RECONCILIATION_ENABLED:-true}
      
      # API Configuration (internal port - external configured via port mapping)
      API_HOST: 0.0.0.0
      API_PORT: 8000
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      neo4j-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aurora-frontend
    restart: unless-stopped
    networks:
      - aurora-network
    ports:
      - "3000:80"
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
