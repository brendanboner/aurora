version: '3.8'

services:
  teams-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora-teams-agent
    restart: unless-stopped
    ports:
      - "3978:3978"
    environment:
      - BOT_ID=${BOT_ID}
      - BOT_PASSWORD=${BOT_PASSWORD}
      - BOT_PORT=3978
      - NODE_ENV=production
      - AURORA_API_URL=http://aurora-backend:8000
      - AURORA_ORACLE_URL=http://aurora-oracle:8000
      - AURORA_CONTENT_CREATOR_URL=http://aurora-content-creator:8000
      - AURORA_FRONTEND_URL=${AURORA_FRONTEND_URL:-http://localhost:3000}
      - AURORA_SERVICE_TOKEN=${AURORA_SERVICE_TOKEN}
      - USE_MOCK_DATA=${USE_MOCK_DATA:-false}
      - TEST_USER_EMAIL=${TEST_USER_EMAIL}
      - TEST_USER_ID=${TEST_USER_ID}
    networks:
      - aurora-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3978/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "com.aurora.service=teams-agent"
      - "com.aurora.description=Microsoft Teams Bot for Aurora"

  teams-agent-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: aurora-teams-agent-dev
    restart: unless-stopped
    ports:
      - "3978:3978"
      - "9229:9229"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BOT_ID=${BOT_ID}
      - BOT_PASSWORD=${BOT_PASSWORD}
      - BOT_PORT=3978
      - AURORA_API_URL=http://aurora-backend:8000
      - AURORA_ORACLE_URL=http://aurora-oracle:8000
      - AURORA_CONTENT_CREATOR_URL=http://aurora-content-creator:8000
      - AURORA_FRONTEND_URL=http://localhost:3000
      - NODE_ENV=development
      # Critical: Set the service URL to use host.docker.internal so bot can reach emulator
      - BOT_EMULATOR_SERVICE_URL=http://host.docker.internal
      # Mock mode and authentication
      - USE_MOCK_DATA=${USE_MOCK_DATA}
      - TEST_USER_EMAIL=${TEST_USER_EMAIL}
      - TEST_USER_ID=${TEST_USER_ID}
      - AURORA_SERVICE_TOKEN=${AURORA_SERVICE_TOKEN}
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Exclude node_modules to use container's version
      - /app/node_modules
    networks:
      - aurora-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3978/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    labels:
      - "com.aurora.service=teams-agent-dev"
      - "com.aurora.description=Microsoft Teams Bot for Aurora (Development)"

networks:
  aurora-network:
    name: octo-rapid-aurora_aurora-network
    external: true
