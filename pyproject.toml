[project]
name = "aurora"
version = "0.1.0"
description = "Aurora RAG System - Monorepo"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv.workspace]
members = [
    "neo4j-client",
    "rabbitmq-client",
    "backend",
    "cli",
    "content_creator_service",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
