# ── WBA Extranet communities ─────────────────────────────────────────────────
# These are auto-set by the WBAExtranetScraper at runtime (it upserts each
# child DataSource with parent_datasource_id='wba_extranet').
# Manual overrides go here when the scraper can't infer the parent correctly,
# e.g. when a workgroup should point at its programme rather than the root.
#
# Example:
#   wba_extranet_c6039e27: wba_extranet_76992aeb   # AI/ML under Next Gen
#
# To find community keys: run cli/wba_dump_hierarchy.py after first scrape.
