# DataSource hierarchy map
#
# Maps child datasource_id → parent_datasource_id for known source families.
# Applied by migrate_datasource_hierarchy.py.
#
# Format:
#   datasource_id: parent_datasource_id
#
# Adding a new entry is additive — it just sets parent_datasource_id on
# the existing DataSource node. Removing an entry is NOT retroactive;
# run the script with --clear to null out parent_datasource_id for a node.
#
# Legend:
#   wba_extranet_*  — WBA Extranet communities (auto-created by scraper)
#   wfa_*           — WFA Causeway datasources
#   ieee802_*       — IEEE 802 working groups
#   ietf_wg_*       — IETF working groups (grouped by area)

# ── WBA public website sub-sources ──────────────────────────────────────────
wba_newsroom: wba
wba_case_studies: wba
wba_industry_reports: wba
wba_presentations: wba
wba_specifications: wba
wba_whitepapers: wba

# ── IEEE 802 working groups ──────────────────────────────────────────────────
ieee802_11: ieee802
ieee802_1: ieee802
ieee802_3: ieee802

