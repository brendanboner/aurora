# =============================================================================
# Aurora Nginx Configuration for Static React Files (HTTP Only)
# =============================================================================
# This configuration serves static React files from a shared volume.
# 
# Use Cases:
#   1. Local testing of production builds
#   2. Production behind AWS CloudFront (CloudFront handles SSL)
# 
# For hot reload development, use nginx.hotreload.conf instead.
# For custom domain with Let's Encrypt, use nginx.letsencrypt.conf instead.
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Docker's embedded DNS resolver — forces nginx to re-resolve service hostnames
# after container restarts rather than caching stale IPs from startup.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP server
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Root directory for static files (shared from frontend container)
    root /usr/share/nginx/html;
    index index.html;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Client body size (for file uploads)
    client_max_body_size 50M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript 
               image/svg+xml;

    # Favicon - return empty response to avoid 404 logs
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Authentication API routes (includes /api/visualisation/ via auth gateway)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        # Variable forces nginx to use the resolver above on every request,
        # so auth container restarts don't leave nginx with a stale cached IP.
        set $auth_upstream "http://auth:8000";
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        
        # Forward original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts (increased for kg-view graph queries)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffering - increased for JWT tokens in cookies
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        
        # Error handling
        proxy_intercept_errors off;
    }

    # KG View Frontend (handles both UI and API proxy internally)
    location ^~ /visualisation/ {
        limit_req zone=general_limit burst=50 nodelay;
        
        # Rewrite to strip /visualisation prefix for upstream
        rewrite ^/visualisation/(.*)$ /$1 break;
        set $kg_upstream "http://kg-view-frontend:5173";
        proxy_pass $kg_upstream;
        proxy_http_version 1.1;
        
        # Forward original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffering
        proxy_buffering off;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Disable caching
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    
    # KG View Frontend - root path redirect
    location = /visualisation {
        absolute_redirect off;
        return 308 /visualisation/;
    }

    # Teams bot messaging endpoint — proxies to teams-agent container
    location ^~ /teams {
        limit_req zone=api_limit burst=30 nodelay;
        rewrite ^/teams/(.*)$ /$1 break;
        set $teams_upstream "http://aurora-teams-agent:3978";
        proxy_pass $teams_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Teams tab React route
    location ^~ /teams-tab {
        limit_req zone=general_limit burst=50 nodelay;
        rewrite ^/teams-tab.*$ /index.html break;
        root /usr/share/nginx/html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Frontend static files - serve directly from nginx
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        
        # Try to serve file directly, fallback to index.html for React Router
        try_files $uri $uri/ /index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    
    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Cache images
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Cache fonts
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
