# =============================================================================
# Aurora Nginx Configuration for Static React Files (HTTP Only)
# =============================================================================
# This configuration serves static React files from a shared volume.
# 
# Use Cases:
#   1. Local testing of production builds
#   2. Production behind AWS CloudFront (CloudFront handles SSL)
# 
# For hot reload development, use nginx.hotreload.conf instead.
# For custom domain with Let's Encrypt, use nginx.letsencrypt.conf instead.
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Upstream backend services
upstream auth {
    server auth:8000;
}

# HTTP server
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Root directory for static files (shared from frontend container)
    root /usr/share/nginx/html;
    index index.html;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Client body size (for file uploads)
    client_max_body_size 50M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript 
               image/svg+xml;

    # Favicon - return empty response to avoid 404 logs
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Authentication API routes
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://auth;
        proxy_http_version 1.1;
        
        # Forward original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering - increased for JWT tokens in cookies
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        
        # Error handling
        proxy_intercept_errors off;
    }

    # Frontend static files - serve directly from nginx
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        
        # Try to serve file directly, fallback to index.html for React Router
        try_files $uri $uri/ /index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    
    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Cache images
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Cache fonts
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
