# =============================================================================
# Aurora Nginx Configuration with Let's Encrypt SSL (Custom Domain)
# =============================================================================
# This configuration:
# - Terminates SSL/TLS with Let's Encrypt certificates
# - Redirects HTTP to HTTPS
# - Serves static React files from shared volume
# - Proxies API requests to auth service
# - Adds security headers
# - Handles Let's Encrypt ACME challenge
# 
# For CloudFront setup (no SSL), use nginx.cloudfront.conf instead.
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Docker's embedded DNS resolver — forces nginx to re-resolve service hostnames
# after container restarts rather than caching stale IPs from startup.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP server - redirect all to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint (for load balancer)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    # Root directory for static files (shared from frontend container)
    root /usr/share/nginx/html;
    index index.html;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    
    # SSL protocols and ciphers (Mozilla Intermediate configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL session cache
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Client body size (for file uploads)
    client_max_body_size 50M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript 
               image/svg+xml;

    # Favicon - return empty response to avoid 404 logs
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Teams Bot Framework messaging endpoint — must come BEFORE /api/ so nginx
    # uses the more-specific exact match and routes directly to the bot,
    # bypassing the auth gateway (Bot Framework uses its own JWT auth).
    location = /api/messages {
        set $teams_upstream "http://aurora-teams-agent:3978";
        proxy_pass $teams_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # API routes - proxy to auth service (includes /api/visualisation/ via auth gateway)
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        
        set $auth_upstream "http://auth:8000";
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts (longer for scraping, auth operations, and kg-view graph queries)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffer settings - increased for JWT tokens
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        
        # Error handling
        proxy_intercept_errors off;
    }

    # KG View Frontend
    location ^~ /visualisation/ {
        # Rate limiting
        limit_req zone=general_limit burst=50 nodelay;
        
        # Rewrite to strip /visualisation prefix for upstream
        rewrite ^/visualisation/(.*)$ /$1 break;
        set $kg_upstream "http://kg-view-frontend:5173";
        proxy_pass $kg_upstream;
        proxy_http_version 1.1;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Disable caching for development
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    
    # KG View Frontend - root path redirect
    location = /visualisation {
        absolute_redirect off;
        return 308 /visualisation/;
    }

    # Teams route - rewrite to index.html for React Router
    location ^~ /teams {
        # Rate limiting
        limit_req zone=general_limit burst=50 nodelay;
        rewrite ^/teams.*$ /index.html break;
        root /usr/share/nginx/html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Frontend static files - serve directly from nginx
    location / {
        # Rate limiting
        limit_req zone=general_limit burst=50 nodelay;
        
        # Try to serve file directly, fallback to index.html for React Router
        try_files $uri $uri/ /index.html;
        
        # Security headers already set at server level
    }
    
    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Cache images
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Cache fonts
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
