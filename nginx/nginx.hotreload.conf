# =============================================================================
# Aurora Nginx Configuration for Hot Reload Development
# =============================================================================
# This configuration proxies to the React dev server for hot reload support.
# Use with docker-compose.yml (default development setup).
# 
# For production static builds, use nginx.cloudfront.conf or nginx.letsencrypt.conf instead.
# =============================================================================

# Upstream backend services
upstream frontend_dev {
    server frontend:3000;
}

upstream auth {
    server auth:8000;
}

# HTTP server
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Client body size (for file uploads)
    client_max_body_size 50M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript 
               image/svg+xml;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Authentication API routes
    location /api/ {
        proxy_pass http://auth;
        proxy_http_version 1.1;
        
        # Forward original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering - increased for JWT tokens in cookies
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        
        # Error handling
        proxy_intercept_errors off;
    }

    # Frontend - proxy to React dev server for hot reload
    location / {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        
        # Forward original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for hot reload
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        
        # Disable caching
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
