version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  neo4j:
    image: neo4j:5.21
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    ports: ["7474:7474","7687:7687"]
    volumes:
      - neo4j_data:/data
      - ./graph:/var/lib/neo4j/import

  backend:
    build: ../backend
    env_file: ../.env
    depends_on: [postgres, neo4j]
    ports: ["8080:8080"]

  frontend:
    build: ../frontend
    env_file: ../.env
    depends_on: [backend]
    ports: ["5173:5173"]

volumes:
  pg_data:
  neo4j_data:
