[project]
name = "aurora-cli"
version = "0.1.0"
description = "Command-line interface for Aurora knowledge graph backend"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[tool.setuptools]
py-modules = ["aurora_query", "aurora_parse"]
