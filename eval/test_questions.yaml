# Aurora Unified Test Question Corpus
# ============================================================
# Consolidates the prior cli/fast_questions.txt, cli/demo_questions.txt,
# and scripts/wba_questions.txt into a single annotated set the evaluation
# harness can drive automatically.
#
# Each entry has:
#   - id            stable identifier, used in test output
#   - category      grouping for stratified sampling / reporting
#   - question      the literal user query
#   - expects_entity (optional) if the answer SHOULD ground on a specific
#                              KG entity (e.g. "Bruno Tomas"), declare it
#                              so the eval can verify rather than just trust
#                              the judge.
#   - expects_source (optional) datasource_id or URL substring the answer
#                              should cite — used by the replay harness.
#   - notes         (optional) free-form context (e.g. why this is tricky).
#
# Categories: recency, topic, comparison, standard, person, organization,
#             event, datasource, regulatory, technical, wba, mention,
#             stress (known-broken cases tracked for regression coverage).
# ============================================================

