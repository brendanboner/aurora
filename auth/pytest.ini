[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
cache_dir = tests/.pytest_cache
addopts =
    -v
    --strict-markers
    --cov=.
    --cov-config=tests/.coveragerc
    --cov-report=term-missing
    --cov-report=html:tests/htmlcov
    --cov-fail-under=80
    -o cache_dir=tests/.pytest_cache
